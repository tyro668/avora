server.address=${HOST:127.0.0.1}
server.port=${PORT:8080}
spring.threads.virtual.enabled=true
spring.main.banner-mode=off
lmbp.tenant=${TENANT_ID:acme}
lmbp.api-key=${TENANT_API_KEY:}
lmbp.issuer=${LMBP_ISSUER:http://${server.address}:${server.port}}
lmbp.signing-seed=${LMBP_SIGNING_SEED:}
lmbp.store=${LMBP_STORE:memory}
lmbp.profile-file=${TENANT_PROFILE_FILE:}
lmbp.display-name=${TENANT_DISPLAY_NAME:}
lmbp.chat-ui-dir=${LMBP_CHAT_UI_DIR:}
lmbp.retention-seconds=${LMBP_RETENTION_SECONDS:604800}
