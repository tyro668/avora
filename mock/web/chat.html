<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat · 本机模型</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--acc:#0f8f80;--acc2:#e6f4f1;--line:#ececea;--mut:#8a8a86;--sub:#5f5f5b;--rail:#f7f7f5;--ink:#1d1d1f;
  --sans:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,"Noto Sans Mono CJK SC",monospace}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;font-size:14px;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.mono{font-family:var(--mono)}
svg{display:block;flex:none}
.hidden{display:none!important}
.sp{flex:1}
.row{display:flex;align-items:center}
/* login */
.login{height:100%;display:flex;align-items:center;justify-content:center;background:var(--rail)}
.login form{width:380px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 8px 28px rgba(0,0,0,.06)}
.login h1{font-size:20px;font-weight:600;margin:14px 0 4px;letter-spacing:-.01em}
.login p{color:var(--sub);font-size:13px;margin-bottom:18px;line-height:1.6}
.login label{display:block;font-size:12.5px;color:var(--sub);margin:12px 0 5px}
.field{width:100%;height:38px;border:1px solid #e3e3df;border-radius:10px;padding:0 12px;background:#fff;outline:none}
.field:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(15,143,128,.12)}
.login .btn{width:100%;margin-top:18px}
.msg-err{color:#c0362c;font-size:12.5px;margin-top:10px;line-height:1.5}
.msg-ok{color:#157a4f;font-size:12.5px;margin-top:10px;line-height:1.5}
/* app */
.app{display:flex;height:100%}
.rail{width:264px;flex:none;background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 12px;min-height:0}
.app.folded .rail{display:none}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px;padding:4px 6px 14px}
.brand small{font-size:10.5px;color:var(--mut);border:1px solid #e2e2df;border-radius:5px;padding:0 5px;font-weight:500}
.ib{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#6b6b67}
.ib:hover{background:#efefec}
.newc{display:flex;align-items:center;gap:8px;height:36px;border-radius:10px;padding:0 10px;font-weight:500;color:#2a2a28;background:#fff;border:1px solid #e6e6e3;box-shadow:0 1px 2px rgba(0,0,0,.03);width:100%;text-align:left}
.newc:hover{background:#fcfcfb}
.hist{flex:1;overflow-y:auto;min-height:0;margin:0 -4px;padding:0 4px}
.hl{font-size:11.5px;color:var(--mut);margin:20px 8px 6px;font-weight:500}
.hi{height:34px;display:flex;align-items:center;padding:0 4px 0 10px;border-radius:8px;color:#3a3a37;font-size:13.5px;width:100%;text-align:left;gap:4px}
.hi span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hi:hover{background:#efefec}
.hi.cur{background:#ebebe8;color:#111;font-weight:500}
.hi .del{width:24px;height:24px;border-radius:6px;display:none;align-items:center;justify-content:center}
.hi:hover .del{display:flex}
.hi .del:hover{background:#e0e0dc}
.dev-ind{margin-top:12px;border:1px solid #e6e6e3;background:#fff;border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;width:100%;text-align:left}
.dev-ind:hover{border-color:#d6d6d2}
.dot{width:8px;height:8px;border-radius:50%;background:#22a06b;box-shadow:0 0 0 3px #dcf3e8;flex:none}
.dot.off{background:#c4c4c0;box-shadow:0 0 0 3px #eeeeec}
.dev-ind b{font-weight:600;font-size:13px;display:block}
.dev-ind span.s{font-size:12px;color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me{display:flex;align-items:center;gap:10px;padding:12px 6px 2px;position:relative}
.av{width:28px;height:28px;border-radius:50%;background:#2a2a28;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
.me b{font-size:13px;font-weight:500;display:block}.me span{font-size:11.5px;color:var(--mut)}
.menu{position:absolute;background:#fff;border:1px solid #e6e6e3;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.12);padding:4px;z-index:30;min-width:150px}
.menu button{display:flex;width:100%;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:7px;font-size:13px;text-align:left}
.menu button:hover{background:#f2f2f0}
.menu button.bad{color:#c0362c}
.me .menu{bottom:40px;right:0}
/* main */
.main{flex:1;display:flex;flex-direction:column;position:relative;min-width:0}
.top{height:52px;flex:none;display:flex;align-items:center;padding:0 22px;gap:8px}
.top .t{font-weight:500;font-size:14px;color:#2a2a28;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scroll{flex:1;overflow-y:auto;position:relative;min-height:0}
.fade{position:sticky;top:0;height:28px;margin-bottom:-28px;background:linear-gradient(#fff,rgba(255,255,255,0));z-index:2;pointer-events:none}
.col{width:740px;max-width:calc(100% - 32px);margin:0 auto;padding-top:8px;min-height:100%;display:flex;flex-direction:column;justify-content:flex-end}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-bottom:60px}
.empty h2{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:14px 0 6px}
.empty p{color:var(--mut)}
.uq{display:flex;justify-content:flex-end;margin:4px 0 16px}
.uq .bubble{background:#f2f2f0;border-radius:18px;padding:10px 16px;max-width:560px;line-height:1.65;font-size:14.5px;white-space:pre-wrap;word-break:break-word}
.uq img{display:block;max-width:240px;max-height:200px;border-radius:10px;margin-top:8px}
.ans{margin-bottom:18px}
.ah{display:flex;align-items:center;gap:8px;margin-bottom:10px;position:relative}
.logo-s{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center}
.ah b{font-weight:600;font-size:13.5px}
.ah .on{font-size:12px;color:var(--mut)}
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);background:#1d1d1f;color:#f5f5f4;font:11px var(--mono);border-radius:7px;padding:5px 9px;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.18);white-space:nowrap;pointer-events:none}
[data-tip]:hover::before{content:"";position:absolute;left:calc(100% + 6px);top:50%;width:8px;height:8px;background:#1d1d1f;transform:translateY(-50%) rotate(45deg);z-index:20}
.ah .who{display:flex;align-items:center;gap:8px}
/* steps */
.steps{border:1px solid var(--line);border-radius:12px;margin:0 0 14px;background:#fcfcfb}
.sh{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;font-size:13px;color:#3a3a37;width:100%;text-align:left}
.sh b{font-weight:500}
.sh .m{color:var(--mut);font-size:12.5px}
.sb{padding:2px 12px 12px 12px;position:relative}
.steps.fold .sb{display:none}
.st{display:flex;align-items:flex-start;gap:10px;position:relative;padding:4px 0;font-size:13px;color:#3a3a37;line-height:1.5}
.st .n{width:16px;height:16px;border-radius:50%;flex:none;margin-top:2px;display:flex;align-items:center;justify-content:center;background:#fff;border:1.5px solid #cfcfcb;z-index:1}
.st .n.ok{background:var(--acc);border-color:var(--acc)}
.st .n.bad{background:#d64545;border-color:#d64545}
.st .n.live{border-color:var(--acc);box-shadow:0 0 0 3px rgba(15,143,128,.15)}
.st .n.live::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--acc)}
.st .tm{margin-left:auto;font-size:12px;color:var(--mut);font-family:var(--mono);white-space:nowrap;padding-left:12px}
.st .d{color:var(--mut)}
.st b{font-weight:500}
.sb::before{content:"";position:absolute;left:19.5px;top:12px;bottom:22px;width:1.5px;background:#e3e3df}
.tool{margin:4px 0 4px 26px;border:1px solid #e3e3df;border-radius:10px;background:#fff;overflow:hidden;position:relative;z-index:1}
.tool .th{display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:12.5px;width:100%;text-align:left}
.tool .fn{font-family:var(--mono);font-weight:600;font-size:12.5px;color:#1d1d1f}
.tool .cid{color:#8a8a86;font-size:12px}
.tool.fold pre{display:none}
.tag{font-size:11px;border-radius:5px;padding:1px 6px;font-weight:500}
.tag.req{background:#eef2ff;color:#4338ca}
.tool pre{margin:0;border-top:1px solid #f0f0ed;background:#fafaf9;padding:8px 12px;font-family:var(--mono);font-size:11.5px;line-height:1.6;color:#3a3a37;white-space:pre-wrap;word-break:break-all}
.k{color:#7c3aed}.s{color:#0f766e}.c{color:#9a9a96}
/* answer body */
.md{font-size:14.5px;line-height:1.8;color:#1f1f1d;word-break:break-word}
.md p{margin:0 0 8px}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{font-weight:600;margin:12px 0 6px;line-height:1.45}
.md h1{font-size:20px}.md h2{font-size:18px}.md h3{font-size:16px}.md h4,.md h5,.md h6{font-size:14.5px}
.md ol,.md ul{padding-left:22px;margin:0 0 10px}
.md li{margin:2px 0}
.md blockquote{border-left:3px solid #e3e3df;padding-left:12px;color:var(--sub);margin:0 0 8px}
.md hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.md a{color:var(--acc);text-decoration:underline;text-underline-offset:2px}
.md code.i{font-family:var(--mono);font-size:12.5px;background:#f2f2f0;border-radius:5px;padding:1px 5px}
.md>:last-child{margin-bottom:0}
.cb{border:1px solid #e6e6e3;border-radius:12px;overflow:hidden;margin:6px 0 4px}
.cb .bh{display:flex;align-items:center;height:34px;padding:0 10px 0 14px;background:#f7f7f5;border-bottom:1px solid #ececea;font-size:12px;color:var(--sub)}
.cb .cp{display:flex;align-items:center;gap:5px;font-size:12px;color:#4a4a47;padding:3px 8px;border-radius:6px}
.cb .cp:hover{background:#ececea}
.cb pre{tab-size:4;margin:0;padding:12px 14px;font-family:var(--mono);font-size:12.5px;line-height:1.7;background:#fcfcfb;color:#2a2a28;overflow-x:auto}
.act{display:flex;align-items:center;gap:2px;min-width:0;margin-top:8px;color:#8a8a86}
.act .ib{width:28px;height:28px}
.mline{font-size:11.5px;color:#9a9a96;font-family:var(--mono);margin-left:6px;background:#f7f7f5;border-radius:7px;padding:3px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;display:block}
.mline i{font-style:normal;color:#c4c4c0;margin:0 6px}
.cursor::after{content:"";display:inline-block;width:8px;height:15px;background:#1d1d1f;border-radius:1.5px;vertical-align:-2px;margin-left:2px;opacity:.75;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.live-line{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sub);margin-bottom:10px;border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 10px;width:max-content;max-width:100%;background:#fcfcfb}
.live-line .sep{color:#c4c4c0}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid #cfe9e4;border-top-color:var(--acc);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.err{margin-top:8px;border:1px solid #f3d0cc;background:#fdf3f2;color:#9b2c22;border-radius:10px;padding:8px 12px;font-size:13px;line-height:1.6}
.err b{font-family:var(--mono);font-weight:600;margin-right:6px}
/* composer */
.comp{width:760px;max-width:calc(100% - 32px);margin:0 auto 18px;border:1px solid #e3e3df;border-radius:20px;background:#fff;box-shadow:0 8px 28px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);padding:14px 12px 10px 18px;flex:none}
.comp textarea{display:block;width:100%;border:0;outline:none;resize:none;font-size:15px;line-height:1.5;min-height:36px;max-height:200px;padding:0 6px 8px 0;background:transparent}
.comp textarea::placeholder{color:#a3a39f}
.att{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sub);margin-bottom:8px}
.att:empty{display:none}
.att img{width:40px;height:40px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.att button{color:var(--mut);font-size:12px;text-decoration:underline}
.composer-bar{display:flex;align-items:center;gap:6px}
.chip{height:32px;border-radius:999px;border:1px solid #e3e3df;display:flex;align-items:center;gap:7px;padding:0 11px 0 9px;font-size:13px;font-weight:500;color:#2a2a28;position:relative;max-width:360px}
.chip:hover{background:#fafaf9}
.chip .dot{width:7px;height:7px;box-shadow:none}
.chip small{color:var(--mut);font-weight:400;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .nm{white-space:nowrap}
.chip select{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.round{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.round.ghost{border:1px solid #e3e3df}
.round.ghost:hover{background:#fafaf9}
.round.dark{background:#1d1d1f}
.round.dark:disabled{background:#d6d6d2;cursor:default}
.foot{text-align:center;font-size:11.5px;color:#a3a39f;margin:-8px 0 12px;flex:none}
/* modal */
.modal-mask{position:fixed;inset:0;background:rgba(30,30,28,.32);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:40;display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.22),0 0 0 1px rgba(0,0,0,.04);max-height:calc(100% - 40px);overflow-y:auto;max-width:calc(100% - 32px)}
.mh{display:flex;align-items:flex-start;gap:12px;padding:22px 24px 6px}
.mh h3{font-size:18px;font-weight:600;letter-spacing:-.01em}
.mh p{font-size:13px;color:var(--sub);margin-top:3px}
.x{color:#8a8a86;border-radius:6px}
.x:hover{background:#f2f2f0}
.btn{height:38px;padding:0 16px;border-radius:10px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid #e3e3df;background:#fff;color:#2a2a28;flex:none}
.btn:hover{background:#fafaf9}
.btn.pri{background:#1d1d1f;border-color:#1d1d1f;color:#fff}
.btn.pri:hover{background:#333}
.btn:disabled{opacity:.55;cursor:default}
.btn.sm{height:30px;font-size:12.5px;padding:0 11px;border-radius:8px}
.badge{font-size:11.5px;font-weight:500;border-radius:999px;padding:1px 8px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.badge.on{background:#e7f6ef;color:#157a4f}
.badge.on::before{content:"";width:6px;height:6px;border-radius:50%;background:#22a06b}
.badge.off{background:#f2f2f0;color:#6b6b67}
.badge.rv{background:#fdecea;color:#b4372b}
.stepc{margin:14px 24px 0;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stepc.active{border-color:#bfe3dc;background:linear-gradient(#f4fbf9,#fff)}
.stepc b.h{font-weight:600;font-size:14px}
.sn{width:22px;height:22px;border-radius:50%;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none;background:#f2f2f0;color:#6b6b67}
.sn.done{background:var(--acc);color:#fff}
.sn.cur{background:#1d1d1f;color:#fff}
.lk{display:flex;align-items:center;gap:8px;margin-top:10px;border:1px solid #ececea;border-radius:10px;padding:6px 6px 6px 12px;background:#fafaf9}
.lk #pairLink{font-family:var(--mono);font-size:12px;color:#4a4a47;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.cli{margin-top:8px;gap:6px;font-size:12.5px;color:#6b6b67}
.cli button{color:#1d1d1f;font-weight:500;margin-left:4px}
.cli button:hover{text-decoration:underline}
.ind{margin-left:32px}
.code{display:flex;align-items:center;gap:8px;margin:14px 0 6px;position:relative}
.code span{width:46px;height:56px;border:1px solid #dcdcd8;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:24px;font-weight:600;background:#fff}
.code.focus span.f{border:2px solid #1d1d1f}
.code em{font-style:normal;color:#c4c4c0;font-size:20px;width:12px;text-align:center}
.code.ind{margin-left:32px}
.code input{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:24px;letter-spacing:40px;caret-color:transparent;cursor:text;border:0}
.adv{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut);margin-top:10px}
.adv svg{transition:transform .15s}
.adv.open svg{transform:rotate(90deg)}
.advb{margin-top:8px}
.advb label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px}
.advb .field{font-family:var(--mono);font-size:12px;height:34px}
.mf{display:flex;align-items:center;gap:8px;padding:18px 24px 20px}
.dl{padding:14px 24px 0}
.dc{display:flex;gap:12px;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;position:relative}
.dc.dim{opacity:.75}
.dic{width:38px;height:38px;border-radius:10px;background:#f2f2f0;display:flex;align-items:center;justify-content:center;flex:none}
.dc .nm{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
.dc .more{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;margin:-2px -4px 0 0}
.dc .more:hover{background:#f2f2f0}
.dc .menu{right:10px;top:38px}
.idl{font-family:var(--mono);font-size:11.5px;color:#a3a39f;margin:2px 0 9px}
.ms{display:flex;flex-wrap:wrap;gap:6px}
.ms span{font-size:12.5px;border:1px solid #ececea;border-radius:8px;padding:2px 8px;display:flex;align-items:center;gap:6px;background:#fafaf9}
.ms span i{font-style:normal;font-size:10.5px;color:#6b6b67;background:#efefec;border-radius:4px;padding:0 4px}
.revoked-toggle{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border:1px dashed #dcdcd8;border-radius:12px;color:#6b6b67;font-size:13px;margin-bottom:6px;width:100%;text-align:left}
.revoked-toggle:hover{background:#fafaf9}
.revoked-toggle svg{transition:transform .15s}
.revoked-toggle.open svg{transform:rotate(90deg)}
.revoked-list{padding-top:4px}
.dl .none{color:var(--mut);font-size:13px;padding:18px 4px 12px;text-align:center}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center}
#toast div{background:#1d1d1f;color:#fff;border-radius:10px;padding:8px 14px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#toast div.bad{background:#b4372b}
</style>
</head>
<body>
<section id="login" class="login">
  <form id="loginForm" autocomplete="off">
    <span class="logo" data-logo="40"></span>
    <h1>登录模拟 SaaS</h1>
    <p>开发登录：用租户 API Key 扮演租户后端。Key 只保存在本标签页，只发给本网关。</p>
    <label for="tenant">租户 ID</label><input id="tenant" class="field" value="acme" required>
    <label for="user">最终用户</label><input id="user" class="field" value="alice" required>
    <label for="key">租户 API Key</label><input id="key" class="field mono" type="password" required>
    <button class="btn pri" type="submit">登录</button>
    <div id="loginErr" class="msg-err"></div>
  </form>
</section>

<div id="app" class="app hidden">
  <aside class="rail">
    <div class="brand"><span class="logo" data-logo="26"></span><span id="brand">Chat</span><small>mock</small><span class="sp"></span><button id="fold" class="ib" title="收起侧栏" data-icon="side" data-c="#8a8a86" data-s="17"></button></div>
    <button id="newChat" class="newc" type="button"><span data-icon="pen" data-c="#2a2a28" data-s="15"></span>新对话</button>
    <nav id="hist" class="hist"></nav>
    <button id="devInd" class="dev-ind" type="button"><span id="devDot" class="dot off"></span><div style="min-width:0;flex:1"><b id="devTitle">未连接设备</b><span id="devSub" class="s">点此配对新设备</span></div><span data-icon="chevr" data-c="#a3a39f" data-s="14"></span></button>
    <div class="me"><span id="avatar" class="av">A</span><div style="min-width:0"><b id="who"></b><span id="whoTenant"></span></div><span class="sp"></span><button id="meMore" class="ib" type="button" title="更多" data-icon="more" data-c="#8a8a86" data-s="16"></button>
      <div id="meMenu" class="menu hidden"><button id="logout" type="button">退出登录</button></div></div>
  </aside>
  <main class="main">
    <div class="top"><button id="unfold" class="ib hidden" title="展开侧栏" data-icon="side" data-c="#8a8a86" data-s="17"></button><span id="title" class="t">新对话</span><span class="sp"></span></div>
    <div id="scroll" class="scroll"><div class="fade"></div><div id="chat" class="col"></div></div>
    <div class="comp">
      <div id="attInfo" class="att"></div>
      <textarea id="input" rows="1" placeholder="给本机模型发送消息…"></textarea>
      <div class="composer-bar">
        <button id="pick" class="round ghost" type="button" title="添加图片" data-icon="img" data-c="#5f5f5b" data-s="16"></button>
        <input id="file" type="file" accept="image/*" class="hidden">
        <span class="sp"></span>
        <label class="chip" id="chip"><span id="chipDot" class="dot off"></span><span id="chipName" class="nm">没有在线模型</span><small id="chipDev"></small><span data-icon="chev" data-c="#8a8a86" data-s="13"></span><select id="model" aria-label="模型"></select></label>
        <button id="stop" class="round dark hidden" type="button" title="停止"><svg width="11" height="11" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3" fill="#fff"/></svg></button>
        <button id="send" class="round dark" type="button" title="发送" data-icon="up" data-c="#fff" data-s="16" data-w="2.4"></button>
      </div>
    </div>
    <div id="foot" class="foot">消息经网关送到你的电脑上执行，回答由本机模型生成</div>
  </main>
</div>

<div id="pairModal" class="modal-mask hidden">
  <div class="modal" style="width:520px" role="dialog" aria-labelledby="pairModalTitle">
    <div class="mh"><div><h3 id="pairModalTitle">配对新设备</h3><p id="pairSub">让 Chat 使用你电脑上的模型</p></div><span id="pairBadge" class="badge off" style="margin:4px 0 0 auto">未配对</span><button id="closePairModal" class="x" type="button" title="关闭" style="margin:2px 0 0 10px" data-icon="x" data-c="#8a8a86" data-s="18"></button></div>
    <div id="step1" class="stepc"><div class="row" style="gap:10px"><span id="sn1" class="sn cur">1</span><b class="h">在 Avora 桌面端粘贴配对链接</b></div>
      <div class="lk"><span data-icon="link" data-c="#8a8a86" data-s="14"></span><span id="pairLink"></span><button id="copyLink" class="btn sm" type="button"><span data-icon="copy" data-c="#2a2a28" data-s="13"></span>复制</button></div>
      <div class="row cli"><span data-icon="term" data-c="#8a8a86" data-s="13"></span>也可以用命令行连接<button id="copyCmd" type="button">复制 CLI 命令</button></div>
    </div>
    <div id="step2" class="stepc"><div class="row" style="gap:10px"><span id="sn2" class="sn">2</span><b id="pairReqTitle" class="h">输入配对码</b></div>
      <div id="pairReqDesc" class="ind" style="font-size:13px;color:#5f5f5b;margin-top:8px">输入你自己电脑上 Avora 桌面端显示的 8 位配对码；不要输入别人发给你的配对码</div>
      <div id="codeBox" class="code ind"><input id="code" maxlength="9" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="配对码"></div>
      <button id="advToggle" class="adv ind" type="button"><span data-icon="chevr" data-c="#8a8a86" data-s="13"></span>高级</button>
      <div id="advBody" class="advb ind hidden"><label for="jkt">设备密钥指纹 jkt（可选，校验配对请求来自这台设备）</label><input id="jkt" class="field" spellcheck="false"></div>
      <div id="pairMsg" class="ind"></div>
    </div>
    <div class="mf"><span class="sp"></span><button id="deny" class="btn" type="button">拒绝</button><button id="approve" class="btn pri" type="button">批准配对</button></div>
  </div>
</div>

<div id="devModal" class="modal-mask hidden">
  <div class="modal" style="width:560px" role="dialog" aria-labelledby="devModalTitle">
    <div class="mh"><div><h3 id="devModalTitle">我的设备</h3><p id="devCount">已配对 0 台，在线 0 台</p></div><span class="sp"></span><button id="openPairModal" class="btn sm" type="button" style="margin-right:8px"><span data-icon="plus" data-c="#2a2a28" data-s="13"></span>配对新设备</button><button id="closeDevModal" class="x" type="button" title="关闭" style="margin:4px 0 0" data-icon="x" data-c="#8a8a86" data-s="18"></button></div>
    <div id="devices" class="dl"></div>
    <div class="mf" style="padding-top:12px"><span style="font-size:12px;color:#a3a39f">吊销等操作在每台设备的 ⋯ 菜单里</span><span class="sp"></span><button id="doneDevModal" class="btn" type="button">完成</button></div>
  </div>
</div>

<div id="toast"></div>
<script src="/chat/chat.js"></script>
</body>
</html>
